name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        pip install flake8 pytest black

    - name: Format check (black)
      run: |
        black --check .

    - name: Lint (flake8)
      run: |
        flake8 .

    - name: Run tests
      run: |
        if [ -d backend ]; then pytest backend -q; else pytest -q; fi

  e2e-if-token:
    if: ${{ secrets.UPSTOX_TOKEN != '' }}
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest httpx
      - name: Export UPSTOX_TOKEN
        run: echo "UPSTOX_TOKEN=${{ secrets.UPSTOX_TOKEN }}" >> $GITHUB_ENV
      - name: Run e2e acceptance test
        run: |
          python -m pytest -q tests/test_e2e.py -q
